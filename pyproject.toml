[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-game-factory"
version = "0.1.0"
description = "Godot-based autonomous game factory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
game-factory = "game_factory.cli:main"

[tool.setuptools]
packages = ["game_factory"]
