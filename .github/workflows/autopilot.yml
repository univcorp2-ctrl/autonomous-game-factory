name: autonomous-portfolio-dry-run

on:
  workflow_dispatch:
    inputs:
      count:
        description: Candidate concepts
        default: '12'
        required: true
      keep:
        description: Projects to materialize
        default: '3'
        required: true
      seed:
        description: Reproducible seed
        default: '2026'
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate portfolio (no publishing)
        run: python -m game_factory.cli batch --count ${{ inputs.count }} --keep ${{ inputs.keep }} --seed ${{ inputs.seed }} --out portfolio
      - name: Upload generated portfolio
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-game-portfolio-${{ github.run_id }}
          path: portfolio/
          retention-days: 7
